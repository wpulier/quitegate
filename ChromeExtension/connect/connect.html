<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuietGate Browser Helper</title>
    <link rel="stylesheet" href="../popup/popup.css">
  </head>
  <body class="connect-page">
    <main>
      <header>
        <p class="eyebrow">Chrome connection</p>
        <h1>Connect QuietGate</h1>
        <p id="connectStatus">Checking this Chrome profile...</p>
      </header>

      <section class="account-panel account-state" aria-label="Connection details">
        <p id="profileDetail">Checking the extension installation...</p>
        <p id="connectDetail">QuietGate will open secure account setup if this profile is signed out.</p>
        <button class="primary-action" id="syncNow" type="button">Continue</button>
      </section>
    </main>

    <script src="connect.js"></script>
  </body>
</html>
