name: QuietGate
options:
  bundleIdPrefix: com.willpulier
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: SY7TABCD5M
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.2.6"
targets:
  QuietGate:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Build Native Host
        script: script/build_native_host.sh
        inputFiles:
          - $(SRCROOT)/NativeHost/QuietGateNativeHost.swift
        outputFiles:
          - $(SRCROOT)/NativeHost/build/quietgate-native-host
        showEnvVars: false
    sources:
      - QuietGate
      - path: Tortoise/AppConfig.swift
        type: file
      - path: Tortoise/InstallationStore.swift
        type: file
      - path: Tortoise/TortoiseModels.swift
        type: file
      - path: Tortoise/ConnectionStatus.swift
        type: file
      - path: Tortoise/TuningCatalog.swift
        type: file
      - path: Tortoise/TuneScreenModel.swift
        type: file
      - path: Tortoise/DevicePresentation.swift
        type: file
      - path: Tortoise/DevicesHubModel.swift
        type: file
      - path: Tortoise/AddDestination.swift
        type: file
      - path: Tortoise/QRCode.swift
        type: file
      - path: Tortoise/IOSEnforcementShared.swift
        type: file
      - path: Tortoise/LaunchRecovery.swift
        type: file
      - path: Tortoise/IOSSession.swift
        type: file
      - path: Tortoise/ManagedAppsShield.swift
        type: file
      - path: ChromeExtension
        buildPhase: resources
        type: folder
      - path: FirefoxExtension
        buildPhase: resources
        type: folder
      - path: NativeHost/build/quietgate-native-host
        buildPhase: resources
        type: file
    dependencies:
      - sdk: Security.framework
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willpulier.QuietGate
        PRODUCT_NAME: Tortoise
        PRODUCT_MODULE_NAME: QuietGate
        INFOPLIST_FILE: QuietGate/Resources/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: SY7TABCD5M
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        TORTOISE_API_BASE_URL: "https://www.yourtortoise.com"
  Tortoise:
    type: application
    platform: iOS
    sources:
      - Tortoise
      - path: QuietGate/Models/BrowserTuningFeature.swift
        type: file
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - target: TortoiseDeviceActivityMonitor
        embed: true
        codeSign: true
      - target: TortoiseShieldConfiguration
        embed: true
        codeSign: true
      - target: TortoiseShieldAction
        embed: true
        codeSign: true
      - target: TortoiseSafariExtension
        embed: true
        codeSign: true
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourtortoise.Tortoise
        PRODUCT_NAME: Tortoise
        INFOPLIST_FILE: Tortoise/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tortoise/Resources/Tortoise.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: SY7TABCD5M
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        TORTOISE_API_BASE_URL: "https://www.yourtortoise.com"
  TortoiseDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - TortoiseDeviceActivityMonitor
      - path: Tortoise/IOSEnforcementShared.swift
        type: file
      - path: Tortoise/LaunchRecovery.swift
        type: file
      - path: Tortoise/IOSSession.swift
        type: file
      - path: Tortoise/ConnectionStatus.swift
        type: file
      - path: Tortoise/TuningCatalog.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourtortoise.Tortoise.DeviceActivityMonitor
        PRODUCT_NAME: TortoiseDeviceActivityMonitor
        INFOPLIST_FILE: TortoiseDeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: TortoiseDeviceActivityMonitor/TortoiseDeviceActivityMonitor.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: SY7TABCD5M
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  TortoiseShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - TortoiseShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourtortoise.Tortoise.ShieldConfiguration
        PRODUCT_NAME: TortoiseShieldConfiguration
        INFOPLIST_FILE: TortoiseShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: TortoiseShieldConfiguration/TortoiseShieldConfiguration.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: SY7TABCD5M
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  TortoiseShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - TortoiseShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourtortoise.Tortoise.ShieldAction
        PRODUCT_NAME: TortoiseShieldAction
        INFOPLIST_FILE: TortoiseShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: TortoiseShieldAction/TortoiseShieldAction.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: SY7TABCD5M
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  TortoiseSafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - TortoiseSafariExtension
      - path: Tortoise/IOSEnforcementShared.swift
        type: file
      - path: Tortoise/LaunchRecovery.swift
        type: file
      - path: Tortoise/IOSSession.swift
        type: file
      - path: Tortoise/ConnectionStatus.swift
        type: file
      - path: Tortoise/TuningCatalog.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourtortoise.Tortoise.SafariExtension
        PRODUCT_NAME: TortoiseSafariExtension
        INFOPLIST_FILE: TortoiseSafariExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TortoiseSafariExtension/TortoiseSafariExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: SY7TABCD5M
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  QuietGateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - QuietGateTests
    dependencies:
      - target: QuietGate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willpulier.QuietGateTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tortoise.app/Contents/MacOS/Tortoise"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TortoiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TortoiseUITests
    dependencies:
      - target: Tortoise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willpulier.TortoiseUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tortoise
        DEVELOPMENT_TEAM: SY7TABCD5M
        CODE_SIGN_STYLE: Automatic
schemes:
  QuietGate:
    build:
      targets:
        QuietGate: all
        QuietGateTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - QuietGateTests
  Tortoise:
    build:
      targets:
        Tortoise: all
        TortoiseUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - TortoiseUITests
